
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Verifikasi OTP - Glow N Dry</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">

  <style>
    :root {
      --otp-blue: #2878d0;
      --otp-blue-dark: #1455a0;
      --otp-blue-light: #eaf3ff;
      --otp-text: #183451;
      --otp-muted: #718198;
      --otp-border: #dce7f5;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      overflow-x: clip;
    }

    body.gnd-auth-body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;

      margin: 0 !important;
      padding: 28px 18px;

      overflow-x: clip;

      background:
        radial-gradient(
          circle at 8% 10%,
          rgba(148, 194, 255, 0.42),
          transparent 28%
        ),
        radial-gradient(
          circle at 92% 92%,
          rgba(169, 210, 255, 0.42),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #eaf3ff 0%,
          #f8fbff 52%,
          #e6f0ff 100%
        );

      color: var(--otp-text);
      font-family: "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* DEKORASI LATAR */
    body.gnd-auth-body::before {
      content: "";
      position: fixed;
      top: -100px;
      left: -100px;
      width: 290px;
      height: 290px;
      border: 1px solid rgba(40, 120, 208, 0.1);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      pointer-events: none;
    }

    body.gnd-auth-body::after {
      content: "";
      position: fixed;
      right: -100px;
      bottom: -120px;
      width: 330px;
      height: 330px;
      border: 1px solid rgba(40, 120, 208, 0.1);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      pointer-events: none;
    }

    /* KONTENER UTAMA */
    .gnd-auth-screen {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 450px;
      min-width: 0;
      margin: auto;
      padding: 20px;
      box-sizing: border-box;
    }

    /* TOMBOL KEMBALI */
    .gnd-auth-screen .gnd-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      margin-bottom: 20px;

      border: 1px solid rgba(220, 231, 245, 0.95);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--otp-blue-dark);

      font-size: 28px;
      text-decoration: none;

      box-shadow: 0 5px 16px rgba(35, 82, 140, 0.07);
      transition: transform 0.2s, background 0.2s;
    }

    .gnd-auth-screen .gnd-back:hover {
      transform: translateX(-3px);
      background: #eaf3ff;
    }

    /* BRAND */
    .gnd-auth-screen .gnd-auth-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      margin: 0 0 25px;
      text-align: center;
    }

    .gnd-auth-screen .gnd-auth-hanger {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 75px;
      height: 75px;

      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 24px;
      background: linear-gradient(145deg, #4b9aee, #1455a0);
      color: #ffffff;
      font-size: 42px;

      box-shadow: 0 12px 26px rgba(40, 120, 208, 0.25);
      transform: rotate(-3deg);
    }

    .gnd-auth-screen .gnd-auth-brand h1 {
      margin: 0;
      color: #174b83;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.8px;
    }

    .gnd-auth-screen .gnd-auth-brand::after {
      content: "LAUNDRY CARE MADE EASY";
      color: #7895b8;
      font-size: 9px;
      font-weight: 850;
      letter-spacing: 2px;
    }

    /* KARTU OTP */
    .gnd-auth-screen .gnd-auth-content {
      width: 100%;
      min-width: 0;
      padding: 30px 27px;

      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.97);

      box-shadow:
        0 20px 50px rgba(35, 82, 140, 0.1),
        0 3px 10px rgba(35, 82, 140, 0.035);
    }

    .gnd-auth-screen .gnd-auth-content h2 {
      margin: 0 0 8px;
      color: #183e6b;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -0.6px;
    }

    .gnd-auth-screen .gnd-auth-subtitle {
      margin: 0 0 24px;
      color: var(--otp-muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .gnd-auth-screen #otpPhone {
      display: inline-block;
      color: var(--otp-blue-dark);
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    /* LABEL */
    .gnd-auth-screen #otpForm > label {
      display: block;
      margin: 18px 0 10px;
      color: #315170;
      font-size: 12px;
      font-weight: 800;
    }

    /* INPUT KODE OTP */
    .gnd-auth-screen #otpCode.gnd-otp-input {
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 65px;
      padding: 15px 10px;

      border: 1.5px solid #cbdff8;
      border-radius: 15px;
      outline: none;

      background: #f5f9ff;
      color: #174b83;

      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 25px;
      font-weight: 850;
      letter-spacing: 10px;
      text-align: center;

      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .gnd-auth-screen #otpCode.gnd-otp-input::placeholder {
      color: #a7c3e7;
      opacity: 1;
      letter-spacing: 5px;
    }

    .gnd-auth-screen #otpCode.gnd-otp-input:focus {
      border-color: var(--otp-blue);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(40, 120, 208, 0.11);
    }

    /* TIMER OTP */
    .gnd-auth-screen .gnd-otp-timer {
      margin: 17px 0 8px;
      color: #718198;
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
    }

    /* KIRIM ULANG */
    .gnd-auth-screen .gnd-resend-button {
      display: block;
      width: 100%;
      min-height: 42px;
      padding: 10px 14px;

      border: 1px solid #d5e6fb;
      border-radius: 12px;

      background: #edf5ff;
      color: var(--otp-blue);

      font-family: inherit;
      font-size: 12px;
      font-weight: 800;

      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .gnd-auth-screen .gnd-resend-button:hover:not(:disabled) {
      transform: translateY(-1px);
      background: #dfeeff;
    }

    .gnd-auth-screen .gnd-resend-button:disabled {
      border-color: #e4eaf2;
      background: #f3f6fb;
      color: #9ba9bb;
      cursor: not-allowed;
    }

    /* PESAN */
    .gnd-auth-screen .gnd-auth-message:empty {
      display: none;
    }

    .gnd-auth-screen .gnd-auth-message:not(:empty) {
      padding: 11px 13px;
      margin: 16px 0 0;

      border: 1px solid #d8e8fc;
      border-radius: 11px;
      background: #eff6ff;
      color: #245d9c;

      font-size: 12px;
      line-height: 1.7;
    }

    /* TOMBOL VERIFIKASI */
    .gnd-auth-screen .gnd-primary-button {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 51px;
      padding: 14px 18px;
      margin-top: 22px;

      border: 1px solid #2878d0;
      border-radius: 13px;

      background: linear-gradient(135deg, #3285dd, #1455a0);
      color: #ffffff;

      font-family: inherit;
      font-size: 14px;
      font-weight: 850;
      letter-spacing: 0.2px;

      cursor: pointer;
      box-shadow: 0 8px 18px rgba(40, 120, 208, 0.2);

      transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
    }

    .gnd-auth-screen .gnd-primary-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 22px rgba(40, 120, 208, 0.27);
      filter: brightness(1.04);
    }

    .gnd-auth-screen .gnd-primary-button:active {
      transform: scale(0.99);
    }

    .gnd-auth-screen .gnd-primary-button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* MODE GELAP */
    body.gnd-dark-mode.gnd-auth-body {
      background:
        radial-gradient(
          circle at 8% 10%,
          rgba(35, 75, 130, 0.25),
          transparent 28%
        ),
        linear-gradient(135deg, #0b1220, #101b2e) !important;
      color: #e7eef9 !important;
    }

    body.gnd-dark-mode .gnd-auth-screen .gnd-auth-brand h1 {
      color: #dcecff !important;
    }

    body.gnd-dark-mode .gnd-auth-screen .gnd-auth-brand::after {
      color: #91aaca !important;
    }

    body.gnd-dark-mode .gnd-auth-screen .gnd-back {
      border-color: #2a3a52;
      background: #151f31;
      color: #9bc9ff;
    }

    body.gnd-dark-mode .gnd-auth-screen .gnd-auth-content {
      border-color: #2a3a52;
      background: #151f31;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    body.gnd-dark-mode .gnd-auth-screen .gnd-auth-content h2 {
      color: #e7f0ff !important;
    }

    body.gnd-dark-mode .gnd-auth-screen .gnd-auth-subtitle {
      color: #a8b8ce !important;
    }

    body.gnd-dark-mode .gnd-auth-screen #otpPhone {
      color: #9bc9ff !important;
    }

    body.gnd-dark-mode .gnd-auth-screen #otpForm > label {
      color: #c4d9f5 !important;
    }

    body.gnd-dark-mode .gnd-auth-screen #otpCode.gnd-otp-input {
      border-color: #354761;
      background: #0f1929;
      color: #e7eef9;
    }

    body.gnd-dark-mode .gnd-auth-screen #otpCode.gnd-otp-input::placeholder {
      color: #607c9e;
    }

    body.gnd-dark-mode .gnd-auth-screen #otpCode.gnd-otp-input:focus {
      border-color: #579ce9;
      background: #111e31;
    }

    body.gnd-dark-mode .gnd-auth-screen .gnd-otp-timer {
      color: #a8b8ce;
    }

    body.gnd-dark-mode .gnd-auth-screen .gnd-resend-button {
      border-color: #2b4565;
      background: #172943;
      color: #9bc9ff;
    }

    body.gnd-dark-mode .gnd-auth-screen .gnd-resend-button:disabled {
      border-color: #2a3a52;
      background: #182235;
      color: #75869f;
    }

    body.gnd-dark-mode .gnd-auth-screen .gnd-auth-message:not(:empty) {
      background: #101f34;
      border-color: #2a4464;
      color: #c4d9f5;
    }

    /* RESPONSIVE */
    @media (max-width: 480px) {
      body.gnd-auth-body {
        align-items: flex-start;
        padding: 15px 12px;
      }

      .gnd-auth-screen {
        max-width: 430px;
        padding: 8px;
      }

      .gnd-auth-screen .gnd-back {
        margin-bottom: 16px;
      }

      .gnd-auth-screen .gnd-auth-brand {
        margin-bottom: 20px;
      }

      .gnd-auth-screen .gnd-auth-hanger {
        width: 66px;
        height: 66px;
        border-radius: 21px;
        font-size: 36px;
      }

      .gnd-auth-screen .gnd-auth-brand h1 {
        font-size: 25px;
      }

      .gnd-auth-screen .gnd-auth-content {
        padding: 25px 21px;
        border-radius: 22px;
      }

      .gnd-auth-screen .gnd-auth-content h2 {
        font-size: 23px;
      }

      .gnd-auth-screen #otpCode.gnd-otp-input {
        min-height: 60px;
        font-size: 23px;
        letter-spacing: 7px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .gnd-auth-screen * {
        transition: none !important;
      }
    }
  </style>
</head>

<body class="gnd-auth-body">

  <main class="gnd-auth-screen">

    <!-- KEMBALI -->
    <a href="register.html" class="gnd-back" aria-label="Kembali">
      ‹
    </a>

    <!-- BRAND -->
    <header class="gnd-auth-brand">
      <div class="gnd-auth-hanger" aria-hidden="true">⌁</div>
      <h1>Glow N Dry</h1>
    </header>

    <!-- FORM OTP -->
    <section class="gnd-auth-content">
      <h2>Verifikasi OTP</h2>

      <p class="gnd-auth-subtitle">
        Masukkan kode verifikasi yang dikirim ke WhatsApp
        <strong id="otpPhone">nomor kamu</strong>.
      </p>

      <form id="otpForm">

        <label for="otpCode">Kode Verifikasi</label>

        <input
          type="text"
          id="otpCode"
          class="gnd-otp-input"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          pattern="[0-9]{6}"
          placeholder="• • • • • •"
          aria-describedby="otpTimer otpMessage"
          required
        >

        <p class="gnd-otp-timer" id="otpTimer">
          Kirim ulang kode (00:45)
        </p>

        <button
          type="button"
          id="resendOtp"
          class="gnd-resend-button"
          disabled
        >
          Kirim ulang kode
        </button>

        <p
          id="otpMessage"
          class="gnd-auth-message"
          role="status"
          aria-live="polite"
        ></p>

        <button type="submit" class="gnd-primary-button">
          Verifikasi
        </button>

      </form>
    </section>

  </main>

  <script src="../js/auth.js"></script>
  <script src="../js/theme.js"></script>

</body>
</html>
